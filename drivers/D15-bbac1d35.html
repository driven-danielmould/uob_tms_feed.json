<style>
:root{--bg:#fff;--ink:#111;--mute:#666;--line:#ddd;--card:#f5f5f5;--waze:#33ccff;--wazeink:#00233a;--gm:#1a73e8;--out:#1565c0;--ret:#2e7d32;--uob:#6a1b9a;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--ink:#f3f3f3;--mute:#aaa;--line:#333;--card:#1c1c1c}}
:root[data-theme="dark"]{--bg:#111;--ink:#f3f3f3;--mute:#aaa;--line:#333;--card:#1c1c1c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:20px;line-height:1.25}
header{padding:14px 16px 8px;border-bottom:2px solid var(--line)}
header h1{margin:0;font-size:26px}
header .sub{margin:4px 0 0;color:var(--mute);font-size:16px}
.days{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:2;border-bottom:1px solid var(--line)}
.days button{flex:0 0 auto;font:inherit;font-size:19px;font-weight:700;padding:12px 16px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.days button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{padding:12px 12px 60px;max-width:640px;margin:0 auto}
.off{padding:40px 10px;text-align:center;font-size:24px;font-weight:700;color:var(--mute)}
.run{margin:0 0 34px}
.ban{margin:0 -12px 14px;padding:18px 16px;background:var(--rc);color:#fff;border-top:8px solid rgba(0,0,0,.35);border-bottom:8px solid rgba(0,0,0,.35)}
.run .stop{border-left:12px solid var(--rc)}
.sign{display:inline-block;background:#FFD400;color:#000;font-weight:900;font-size:30px;padding:4px 14px;border-radius:8px;border:3px solid #000;letter-spacing:1px;vertical-align:middle;margin-left:6px;line-height:1.1}
.ban .r{font-size:44px;font-weight:900;letter-spacing:1px;line-height:1}
.ban .d{font-size:22px;font-weight:800;margin-top:4px}
.ban .s{font-size:17px;opacity:.9;margin-top:4px}
.stop{background:var(--card);border-radius:18px;padding:16px 16px 14px;margin:14px 0;border:2px solid var(--line)}
.stop .k{font-size:34px;font-weight:900;letter-spacing:.5px}
.stop.U .k{color:var(--uob)}
.stop .nm{font-size:30px;font-weight:800;margin:4px 0 2px;line-height:1.15}
.stop .tm{font-size:56px;font-weight:900;letter-spacing:-1px;margin:2px 0 6px;line-height:1}
.stop .meta{font-size:17px;color:var(--mute);margin:0 0 10px}
.pax{list-style:none;margin:0 0 12px;padding:0;border-top:1px solid var(--line)}
.pax li{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:20px}
.pax .pn{font-weight:700}.pax .pc{font-family:ui-monospace,Menlo,monospace;font-weight:800;background:#FFD400;color:#000;padding:2px 8px;border-radius:6px;font-size:17px}
.btns{display:flex;gap:10px}
.btns a{flex:1;display:block;text-align:center;text-decoration:none;font-weight:900;font-size:22px;padding:20px 8px;border-radius:14px;color:#fff;letter-spacing:.3px}
.btns a.w{background:var(--waze);color:var(--wazeink)}
.btns a.g{background:var(--gm)}
.foot{margin-top:30px;font-size:15px;color:var(--mute);text-align:center}
.foot a{color:var(--mute)}
#gate{position:fixed;inset:0;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;z-index:9;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.gbox{width:min(92vw,420px);text-align:center}.gbox h1{font-size:28px;margin:0 0 6px}.gbox p{color:#aaa;margin:0 0 18px;font-size:16px}
#pin{width:100%;font-size:32px;text-align:center;padding:14px;border-radius:12px;border:2px solid #444;background:#222;color:#fff;letter-spacing:4px}
#go{width:100%;margin-top:12px;font-size:24px;font-weight:900;padding:18px;border-radius:12px;border:0;background:#FFD400;color:#000}
.err{color:#ff7b7b;min-height:22px;margin-top:10px}</style></head><body>

function b64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function unlock(pw){const salt=b64(ENC.salt),iv=b64(ENC.iv),ct=b64(ENC.ct);
 const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:ITER,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
 const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct);return new TextDecoder().decode(pt)}
async function tryPw(pw,remember){const b=document.getElementById("go");b.textContent="…";try{const pt=await unlock(pw);if(remember){try{localStorage.setItem(KEY,pw)}catch(e){}}document.getElementById("gate").remove();window.onUnlock(pt)}catch(e){b.textContent="OPEN";document.getElementById("err").textContent="Wrong code — try again";document.getElementById("pin").value=""}}
document.getElementById("go").onclick=()=>tryPw(document.getElementById("pin").value.trim(),true);
document.getElementById("pin").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("go").click()});
(function(){let s=null;try{s=localStorage.getItem(KEY)}catch(e){}if(s)tryPw(s,false);else document.getElementById("pin").focus()})();</script>
<script>
let D=null;
window.onUnlock=function(pt){D=JSON.parse(pt);cur=pick();render()};
function pick(){const t=new Date();const key=t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");
 const i=D.days.findIndex(d=>d.key===key);return i>=0?i:0}
let cur=0;
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function render(){
 document.getElementById("days").innerHTML=D.days.map((d,i)=>`<button class="${i===cur?"on":""}" onclick="cur=${i};render()">${d.short}</button>`).join("");
 const d=D.days[cur];let h="";
 if(!d.runs.length)h=`<div class="off">No runs ${esc(d.short)} — day off</div>`;
 else{
  h+=`<p style="margin:6px 4px 0;font-size:18px;color:var(--mute)">${esc(d.label)} · sign on <b style="color:var(--ink)">${d.sign_on}</b> · sign off <b style="color:var(--ink)">${d.sign_off}</b></p>`;
  d.runs.forEach((r,i)=>{
   const RC=["#1565c0","#2e7d32","#c62828","#6a1b9a","#e65100","#00695c","#4e342e","#283593"];
   h+=`<section class="run ${r.dir}" style="--rc:${RC[i%RC.length]}"><div class="ban"><div class="r">RUN ${i+1} <span class="sign">${esc(r.bus)}</span></div><div class="d">${r.dir==="O"?"TO UoB · arrive "+r.target:"FROM UoB · leave "+r.target}</div><div class="s">${r.stops.length-1} stops · ${r.n} passenger${r.n===1?"":"s"}</div></div>`;
   r.stops.forEach((s,j)=>{
    h+=`<div class="stop ${s.uob?"U":""}"><div class="k">${s.uob?"UoB":"STOP "+(j+1)}</div><div class="nm">${esc(s.name)}</div><div class="tm">${s.time}</div><div class="meta">${s.pax?esc(s.pax)+" · ":""}${esc(s.instr||"")}</div>${s.riders&&s.riders.length?`<ul class="pax">${s.riders.map(p=>`<li><span class="pn">${esc(p.name)}</span><span class="pc">${esc(p.code)}</span></li>`).join("")}</ul>`:""}<div class="btns"><a class="w" href="${s.waze}" target="_blank" rel="noopener">WAZE</a><a class="g" href="${s.gmaps}" target="_blank" rel="noopener">GOOGLE MAPS</a></div></div>`});
   h+=`</section>`});
 }
 h+=`<p class="foot">Full week rota (PDF): <a href="https://raw.githubusercontent.com/driven-danielmould/uob_tms_feed.json/main/drivers/D15-bbac1d35.pdf">download</a> · DrivenBus · UoB Dubai · week of 5 Oct 2026</p>`;
 document.getElementById("app").innerHTML=h;window.scrollTo(0,0)}
</script></body></html>
