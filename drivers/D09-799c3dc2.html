 rs.forEach((r,i)=>{const v=r.vehicle;const hos=handovers(d,v);const tk=hos.find(x=>x.before===r.id);
  if(tk&&i>0)h+=`<li class="swap"><div class="t">${tk.next}</div><div><div class="what">Take ${W.vehicles[v].name} from ${W.drivers[tk.from].name}</div><div class="more">At ${esc(tk.place)}${tk.empty?". Drive empty to "+esc(tk.empty):""}</div><div style="margin-top:8px">${plate(v,"big")}</div></div></li>`;
  else if(i>0&&rs[i-1].vehicle!==v)h+=`<li class="swap"><div class="t">${r.start}</div><div><div class="what">Change to ${W.vehicles[v].name}</div><div style="margin-top:8px">${plate(v,"big")}</div></div></li>`;
  const first=r.stops[0],last=r.stops[r.stops.length-1];
  h+=`<li><div class="t">${r.start}</div><div><div class="what">Run ${i+1}: ${r.dir==="O"?"to UoB, arrive "+r.target:"from UoB, leave "+r.target}</div><div class="more">${r.dir==="O"?"First pickup "+esc(first.pool.name)+" at "+first.time:"Last drop "+esc(last.pool.name)+" at "+last.time}</div><div class="more">${r.n} passenger${r.n===1?"":"s"} · ${r.stops.length-1} stop${r.stops.length-1===1?"":"s"}</div><div style="margin-top:8px">${plate(v,"big")}</div>${opts.runHref?`<a class="btn" href="${opts.runHref(r,i)}">${opts.runLabel||"Open run sheet"}</a>`:""}</div></li>`;
  const hd=hos.find(x=>x.after===r.id);if(hd)h+=`<li class="swap"><div class="t">${hd.when}</div><div><div class="what">Hand ${W.vehicles[v].name} to ${W.drivers[hd.to].name}</div><div class="more">At ${esc(hd.place)}</div></div></li>`;
  if(i<rs.length-1){const gap=T(rs[i+1].start)-T(r.end);if(gap>=60)h+=`<li class="rest"><div class="t">${r.end}</div><div><div class="what">Rest ${dur(gap)}</div><div class="more">${r.dir==="O"?"At the university":"Until the next run"} · next run ${rs[i+1].start}</div></div></li>`;else h+=`<li class="rest"><div class="t">${r.end}</div><div><div class="what">Turn around, ${dur(gap)}</div><div class="more">Next run ${rs[i+1].start} from ${esc(startPlace(rs[i+1]))}</div></div></li>`}});
 h+=`<li class="mark"><div class="t">${du.sign_off}</div><div><div class="what">Sign off</div><div class="more">After the last drop</div></div></li></ul>`;
 return h}
function copyText(u){const done=()=>{const t=$("#toast");if(!t)return;t.style.display="block";setTimeout(()=>t.style.display="none",1500)};if(navigator.clipboard)navigator.clipboard.writeText(u).then(done,()=>prompt("Copy this link",u));else prompt("Copy this link",u)}
function copyLink(){copyText(location.href)}

function render(){const did=W.me,dr=W.drivers[did];
 let h=`<h1>${dr.name}</h1><p class="sub">${W.week_label} · your rota</p><div class="weekrota">`+W.days.map(d=>{const du=driverDuty(d,did);return du?`<div><b>${d.short}</b>${du.sign_on}–${du.sign_off}<br><span style="color:${CC[du.cor]}">${CN[du.cor]}</span></div>`:`<div class="off"><b>${d.short}</b>Day off</div>`}).join("")+`</div><div class="tiles"><div class="tile"><b>${weekDays(did)}</b><span>days this week</span></div><div class="tile"><b>${dur(T(dr.hours))}</b><span>on duty (sign on to sign off)</span></div><div class="tile"><b>${dur(weekDriving(did))}</b><span>actually driving</span></div><div class="tile"><b>${dur(T(dr.hours)-weekDriving(did))}</b><span>rest and waiting inside duties</span></div></div><p class="sub" style="font-size:16px;color:var(--ink2);font-weight:400">You are driving ${dur(weekDriving(did))} this week across ${weekDays(did)} days; the rest of your ${dur(T(dr.hours))} on duty is waiting at the university or between runs. Daily limits: 14h on duty, 11h30 driving, 11h rest between days. Each day below: sign on, runs, rests, vehicle changes, sign off. The yellow plate is the sign in the bus you drive.</p>`;
 let runIdx=0;
 for(const d of W.days){if(!driverDuty(d,did))continue;h+=`<div class="daysep" id="d${d.i}">${d.label}</div>`+daySheet(d,did,{runHref:(r)=>`#r${d.i}-${r.id}`,runLabel:"See stops for this run"});
  for(const r of driverRuns(d,did))h+=`<section class="runsheet" id="r${d.i}-${r.id}">`+runSheet(d,r,{noCopy:true,noDriverLink:true,simple:true}).replace(/<h1 /,'<h2 ').replace(/<\/h1>/,'</h2>')+`</section>`}
 document.getElementById("app").innerHTML=h}
render();
</script></body></html>
