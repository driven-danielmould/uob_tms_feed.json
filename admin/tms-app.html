<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 --bg:#ffffff;--bg2:#f3f5f4;--ink:#17201f;--ink2:#5b6663;--line:#dfe4e2;--link:#1f5fae;--warn-bg:#fff2dc;--warn-ink:#7a4a00;--ok-bg:#e6f4ea;--ok-ink:#1e5a2e;--sea:#e7eef5;--land:#ffffff;--coast:#b9c4cc;--plate:#ffd400;--plate-ink:#111}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#131516;--bg2:#1c1f21;--ink:#eef1f0;--ink2:#a4adaa;--line:#2c3133;--link:#7fb0f0;--warn-bg:#3a2a0d;--warn-ink:#ffd58a;--ok-bg:#12301b;--ok-ink:#9bd7ac;--sea:#1a2229;--land:#22272a;--coast:#4a5860}}
:root[data-theme="dark"]{--bg:#131516;--bg2:#1c1f21;--ink:#eef1f0;--ink2:#a4adaa;--line:#2c3133;--link:#7fb0f0;--warn-bg:#3a2a0d;--warn-ink:#ffd58a;--ok-bg:#12301b;--ok-ink:#9bd7ac;--sea:#1a2229;--land:#22272a;--coast:#4a5860}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5;font-variant-numeric:tabular-nums}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:960px;margin:0 auto;padding:0 18px 60px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .wrap{display:flex;align-items:center;gap:18px;padding:12px 18px;flex-wrap:wrap}
.brand{font-weight:600;font-size:17px;letter-spacing:-.01em;color:var(--ink)}.brand small{display:block;font-weight:400;color:var(--ink2);font-size:13px}
nav{display:flex;gap:4px;flex-wrap:wrap}nav a{padding:6px 10px;border-radius:8px;color:var(--ink);font-size:14px}nav a.on{background:var(--bg2);font-weight:500}
h1{font-size:26px;line-height:1.2;font-weight:600;letter-spacing:-.02em;margin:28px 0 6px}h2{font-size:18px;font-weight:600;margin:28px 0 10px}
.sub{color:var(--ink2);margin:0 0 18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:18px 0}
.tile{background:var(--bg2);border-radius:10px;padding:12px 14px}.tile b{display:block;font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.1}.tile span{color:var(--ink2);font-size:13px}
.cor{border-left:4px solid var(--c);padding-left:14px;margin:22px 0}.cor h2{margin:0 0 2px}.cor .sub{margin-bottom:8px}
.runs{display:grid;gap:6px}
.run{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;color:var(--ink)}
.run:hover{background:var(--bg2);text-decoration:none}.run .t{font-size:20px;font-weight:600;letter-spacing:-.02em}.run .d{font-size:14px;color:var(--ink2)}.run .meta{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12.5px;background:var(--bg2);color:var(--ink);white-space:nowrap}
.tag.lift{background:var(--warn-bg);color:var(--warn-ink)}.tag.walk{background:var(--ok-bg);color:var(--ok-ink)}.tag.driver{border:1px solid var(--line);background:transparent}
.plate{display:inline-block;background:var(--plate);color:var(--plate-ink);font-weight:700;letter-spacing:.06em;padding:3px 10px;border-radius:6px;border:2px solid #111;font-size:14px;white-space:nowrap}
.plate.big{font-size:22px;padding:6px 14px;border-width:3px}.plate.huge{font-size:34px;padding:8px 18px;border-width:3px}
.map{background:var(--sea);border-radius:12px;overflow:hidden;border:1px solid var(--line)}.map svg{display:block;width:100%;height:auto}
.stops{margin:0;padding:0;list-style:none}.stop{display:grid;grid-template-columns:58px 26px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.stop:first-child{border-top:0}
.stop .tm{font-size:19px;font-weight:600;letter-spacing:-.02em;line-height:1.2}.stop .n{width:24px;height:24px;border-radius:50%;background:var(--c);color:#fff;font-size:12.5px;font-weight:600;display:flex;align-items:center;justify-content:center;margin-top:3px}
.stop .name{font-weight:500}.nav{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px}.pin{display:inline-block;font-weight:500;font-size:13px;color:var(--ink2);border:1px solid var(--border);border-radius:14px;padding:2px 9px;margin-left:8px;vertical-align:middle;text-decoration:none}.leg{display:flex;gap:12px;align-items:flex-start;margin:4px 0 4px 20px;padding:10px 14px;border-left:3px dashed #1a73e8;background:#eef4ff;border-radius:0 10px 10px 0;list-style:none}.leg.first{margin-left:0;margin-bottom:10px}.legarrow{font-size:20px;color:#1a73e8;line-height:1;margin-top:2px}.legbody{flex:1}.leglbl{font-size:13px;letter-spacing:.3px;color:#1a3d7a}.leglbl b{font-size:15px;color:var(--ink)}.legtime{color:var(--ink2);font-weight:400}.legbtns{display:flex;gap:8px;margin-top:6px}.legend{font-size:13px;color:var(--ink2);background:var(--card2,#f6f7f9);border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin:8px 0 10px}.navlbl{font-weight:600;color:var(--ink);margin-right:2px}.btn.wz{background:#33cdff;color:#0b2a35;border-color:#33cdff;font-size:13px;padding:5px 12px}.btn.gm{background:#1a73e8;color:#fff;border-color:#1a73e8;font-size:13px;padding:5px 12px}.stop .where{color:var(--ink2);font-size:14px}
.pax{margin:6px 0 0;padding:0;list-style:none;font-size:14.5px}.pax li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;padding:3px 0}.pax .who{font-weight:500}.pax .from{color:var(--ink2)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0;align-items:center}
button,.btn{font:inherit;font-size:14px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}button:hover,.btn:hover{background:var(--bg2);text-decoration:none}
.duty{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}.duty .head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.legs{margin:8px 0 0;padding:0;list-style:none}.legs li{display:grid;grid-template-columns:118px 1fr;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}.legs li.rest{color:var(--ink2);font-size:14px}
.legs li.changeover{color:var(--warn-ink);background:var(--warn-bg);border-radius:8px;padding:8px 8px;margin:4px 0;border-top:0}
.note{background:var(--bg2);border-radius:10px;padding:12px 14px;font-size:14.5px;margin:14px 0}
.toast{position:sticky;bottom:12px;margin:12px auto 0;width:max-content;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:14px;display:none}
table{border-collapse:collapse;width:100%;font-size:14.5px}td,th{text-align:left;padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}th{color:var(--ink2);font-weight:500;border-top:0}.tw{overflow-x:auto}
.rota td{white-space:nowrap}.rota .off{color:var(--ink2)}.rota .cell{display:inline-block;position:relative;padding:3px 7px;border-radius:6px;border-left:4px solid var(--c);background:var(--bg2);font-size:13px}
.badge{position:absolute;top:-8px;right:-8px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#d03b3b;color:#fff;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--bg);line-height:1}
.rota td{padding-right:14px}.rota .cell{margin:8px 0 2px}
.badge.pax{right:auto;left:-8px;background:#1f5fae}.badge.pax.over{background:#d03b3b}

.big h1{font-size:34px;margin-top:22px}.big .sub{font-size:19px;font-weight:500;color:var(--ink);margin-bottom:14px}
.big .tiles{grid-template-columns:repeat(2,1fr)}.big .tile b{font-size:32px}.big .tile span{font-size:15px}

.day li .t{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.05}.day li .what{font-size:22px;font-weight:600;line-height:1.25}.day li .more{font-size:17px;color:var(--ink2);margin-top:4px}
.day li.mark{background:var(--bg2);border-color:transparent}.day li.rest{border-style:dashed}.day li.swap{background:var(--warn-bg);border-color:transparent;color:var(--warn-ink)}.day li.swap .more{color:var(--warn-ink)}
.day .btn{display:inline-block;margin-top:10px;font-size:17px;font-weight:600;padding:10px 16px;border-width:2px}
.big .stop{grid-template-columns:76px 30px 1fr;padding:14px 0}.big .stop .tm{font-size:26px}.big .stop .n{width:28px;height:28px;font-size:14px;margin-top:6px}.big .stop .name{font-size:19px;font-weight:600}.big .stop .where{font-size:16px}
.big .pax{font-size:17px}.big .pax li{padding:4px 0}.big .tag{font-size:14px;padding:4px 10px}
.runsheet{margin:26px 0 0;padding-top:18px;border-top:3px solid var(--line)}.runsheet h2{font-size:26px;margin:0 0 4px}
.daysep{margin:44px 0 0;padding:14px 18px;background:var(--ink);color:var(--bg);border-radius:14px;font-size:24px;font-weight:600}
.weekrota{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:14px 0 6px}

function mapSvg(stops,color){

 let dx=(lo1-lo0)*cosl,dy=la1-la0;const mn=0.08;if(dx<mn)dx=mn;if(dy<mn*H/Wd)dy=mn*H/Wd;const sc=Math.min(Wd*(1-2*pad)/dx,H*(1-2*pad)/dy);const cx=(lo0+lo1)/2,cy=(la0+la1)/2;

 stops.forEach((s,i)=>{const [x,y]=pts[i];const u=s.pool.id==="UOB";out+=u?`<rect x="${x-7}" y="${y-7}" width="14" height="14" transform="rotate(45 ${x} ${y})" fill="#1f5fae" stroke="var(--land)" stroke-width="2"/>`:`<circle cx="${x}" cy="${y}" r="11" fill="${color}" stroke="var(--land)" stroke-width="2"/><text x="${x}" y="${y+4}" text-anchor="middle" font-size="11" font-weight="600" fill="#fff" font-family="IBM Plex Sans,sans-serif">${i+1}</text>`;

function pageRun(i,id){const d=W.days[i];const r=d&&d.runs.find(x=>x.id===id);if(!r)return`<h1>Run not found</h1>`;return `<p class="sub" style="margin-top:22px"><a href="#/day/${i}">← ${d.label}</a></p>`+runSheet(d,r)}
function chip(d,r){return `<a class="tag" href="#/run/${d.i}/${r.id}" style="background:${CC[r.cor]}22;color:var(--ink);margin:2px 4px 2px 0"><b>${r.start}</b>→${r.end} · ${r.n} pax · ${W.vehicles[r.vehicle].name}</a>`}
function pageNetwork(){
 const L={};
 // C4 (Abu Dhabi) from bottom right, C5 (Deira) from top left: keys follow the internal ids
 const LINES=[["S1",[[1330,120],[907,120],[707,320],[707,510]],"right"],["N1",[[1330,420],[960,420],[760,500],[740,540]],"right"],["D5",[[60,170],[493,170],[693,370],[693,510]],"left"],["M2",[[60,560],[655,560]],"mid"],["J3",[[60,940],[493,940],[693,740],[693,610]],"left"],["F4",[[200,1120],[600,1120],[693,900],[693,610]],"left"],["A1",[[1330,940],[907,940],[707,740],[707,610]],"right"]];
 const UX=700,UY=560;
 function along(pts,t){let segs=[],tot=0;for(let i=0;i<pts.length-1;i++){const dx=pts[i+1][0]-pts[i][0],dy=pts[i+1][1]-pts[i][1];const l=Math.hypot(dx,dy);segs.push({a:pts[i],b:pts[i+1],l,dx,dy});tot+=l}
  let d=t*tot;for(const sg of segs){if(d<=sg.l){const f=d/sg.l;return {x:sg.a[0]+sg.dx*f,y:sg.a[1]+sg.dy*f,dir:sg.dy===0?"h":(sg.dx===0?"v":"d")}}d-=sg.l}const sg=segs[segs.length-1];return {x:sg.b[0],y:sg.b[1],dir:sg.dy===0?"h":(sg.dx===0?"v":"d")}}
 let svg=`<svg viewBox="0 0 1400 1170" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block;font-family:IBM Plex Sans,system-ui,sans-serif"><rect width="1400" height="1170" fill="var(--bg)"/>`;
 for(const [c,pts,side] of LINES){svg+=`<polyline points="${pts.map(p=>p.join(",")).join(" ")} ${c==="M2"?UX-24+","+UY:(pts[pts.length-1][1]<UY?pts[pts.length-1][0]+","+(UY-28):pts[pts.length-1][0]+","+(UY+28))}" fill="none" stroke="${CC[c]}" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>`}
 for(const [c,pts,side] of LINES){const stops=W.pools[c];const n=stops.length;let labels="";
  stops.forEach((p,i)=>{const t=(i+0.5)/(n+1.1);const q=along(pts,t);const name=p.name.split(",")[0];
   let lx,ly,anchor,rot=0;
   if(q.dir==="h"){const below=q.y>UY;lx=q.x+5;ly=below?q.y+22:q.y-14;anchor="start";rot=c==="M2"?-32:(below?40:-40)}
   else if(q.dir==="v"){if(side==="right"){lx=(c==="J3"?q.x+32:q.x+18);anchor="start"}else{lx=q.x-18;anchor="end"}ly=q.y+5}
   else{ if(side==="right"){lx=q.x+16;anchor="start"}else{lx=q.x-16;anchor="end"} ly=q.y+5;
     const hy=pts[0][1]; if(Math.abs(q.y-hy)<34){ly=hy<UY?hy+30:hy-20} }
   svg+=`<circle cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="7" fill="var(--bg)" stroke="${CC[c]}" stroke-width="4"/>`;
   labels+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${anchor}" font-size="13" fill="var(--ink)" stroke="var(--bg)" stroke-width="4" paint-order="stroke" stroke-linejoin="round"${rot?` transform="rotate(${rot} ${lx.toFixed(1)} ${ly.toFixed(1)})"`:""}>${esc(name)}</text>`});
  svg+=labels}
 svg+=`<circle cx="${UX}" cy="${UY}" r="26" fill="var(--bg)" stroke="var(--ink)" stroke-width="6"/><circle cx="${UX}" cy="${UY}" r="12" fill="var(--ink)"/><text x="${UX+40}" y="${UY+6}" font-size="18" font-weight="700" fill="var(--ink)" stroke="var(--bg)" stroke-width="5" paint-order="stroke">University of Birmingham Dubai</text>`;
 // legend
 const leg=[["S1", "Sharjah direct", "Al Zahia \u00b7 Maysaloon \u00b7 Nesto \u00b7 Majaz \u00b7 Al Taawun \u00b7 direct via E311"], ["N1", "Al Nahda \u00b7 Qusais \u00b7 Mirdif", "Al Nahda 1&2 \u00b7 Qusais \u00b7 DAFZA \u00b7 Muhaisnah \u00b7 Mirdif \u00b7 Warsan"], ["M2", "Marina \u00b7 Barsha \u00b7 Springs", "Palm \u00b7 Marina \u00b7 JLT \u00b7 The Greens \u00b7 Barsha \u00b7 MOE"], ["J3", "JVC \u00b7 DAMAC \u00b7 Town Square \u00b7 Silicon Oasis", "JVC \u00b7 Barsha South \u00b7 Sports City \u00b7 Motor City \u00b7 Town Square \u00b7 Dubailand \u00b7 Silicon Oasis"], ["A1", "Abu Dhabi direct", "Corniche \u00b7 Al Danah \u00b7 Al Wahda \u00b7 Khalifa City \u00b7 Raha \u00b7 Al Bahia \u00b7 Ghadeer"], ["F4", "Al Furjan \u00b7 Gardens \u00b7 DIP", "Al Furjan \u00b7 Discovery Gardens \u00b7 Gardens Metro \u00b7 Green Community \u00b7 DWC"], ["D5", "Deira \u00b7 Bur Dubai \u00b7 Business Bay", "Deira \u00b7 Bur Dubai \u00b7 WTC \u00b7 Business Bay \u00b7 Meydan \u00b7 Ras Al Khor"]];
 svg+=`<g transform="translate(990,340)">`+leg.map(([c,n,d],i)=>`<rect x="0" y="${i*34}" width="28" height="12" rx="6" fill="${CC[c]}"/><text x="38" y="${i*34+11}" font-size="14" font-weight="600" fill="var(--ink)">${n}</text><text x="38" y="${i*34+27}" font-size="12" fill="var(--ink2)">${esc(d)}</text>`).join("")+`</g></svg>`;
 return `<h1>Network</h1><p class="sub">Schematic map of the five corridors and every pooled stop, in running order. Not to scale; lines run inbound to the university in the morning and outbound from it in the afternoon.</p><div style="border:1px solid var(--line);border-radius:12px;overflow:hidden">${svg}</div>`}
function pageCorridors(){
 let h=`<h1>Corridors</h1><p class="sub">What each corridor does every day: runs with their start and end times, passengers, vehicles and drivers. Chips open the run sheet.</p>`;
 for(const c of ["S1","N1","M2","J3","A1","F4","D5"]){
  const stops=W.pools[c].map(p=>p.name.split(",")[0]);
  h+=`<section class="cor" style="--c:${CC[c]}"><h2>${CN[c]}</h2><p class="sub">${CS[c]}</p><div class="tw"><table><tr><th>Day</th><th>Runs</th><th>To UoB (first pickup → arrive)</th><th>From UoB (leave → last drop)</th><th>Vehicles</th><th>Drivers</th></tr>`;
  for(const d of W.days){const rs=d.runs.filter(r=>r.cor===c);if(!rs.length){h+=`<tr><td><b>${d.short}</b></td><td colspan="5" style="color:var(--ink2)">no runs</td></tr>`;continue}
   const ins=rs.filter(r=>r.dir==="O").sort((a,b)=>a.start.localeCompare(b.start)),outs=rs.filter(r=>r.dir==="R").sort((a,b)=>a.start.localeCompare(b.start));
   const vs=[...new Set(rs.map(r=>r.vehicle))],ds=[...new Set(rs.map(r=>r.driver))];const trips=rs.reduce((a,r)=>a+r.n,0);
   h+=`<tr><td><b>${d.short}</b><br><span style="color:var(--ink2);font-size:13px">${rs[0]?ins.length?ins[0].start:"":""}–${rs.length?[...rs].sort((a,b)=>b.end.localeCompare(a.end))[0].end:""}</span></td><td><b>${rs.length}</b><br><span style="color:var(--ink2);font-size:13px">${trips} trips</span></td><td>${ins.map(r=>chip(d,r)).join("")}</td><td>${outs.map(r=>chip(d,r)).join("")}</td><td>${vs.map(v=>plate(v)).join(" ")}</td><td>${ds.map(x=>`<a href="#/driver/${x}">${W.drivers[x].name}</a>`).join("<br>")}</td></tr>`}
  h+=`</table></div></section>`}
 return h}
function pageDrivers(){let h=`<h1>Drivers</h1><p class="sub">Copy link gives the driver's own week page: their rota, every day sheet and every run sheet, nothing else. Home base: SHJ Sharjah · BH Barsha Heights · ADH Abu Dhabi · DD Deira. H = drives a Rosa this week, so needs a heavy bus licence.</p>`;
 for(const dr of Object.values(W.drivers)){const days=W.days.filter(d=>driverDuty(d,dr.id));h+=`<div style="display:grid;grid-template-columns:1fr auto;gap:6px;margin-bottom:8px"><a class="run" href="#/driver/${dr.id}" style="grid-template-columns:1fr auto"><div>${dr.name}<div class="d">${days.map(d=>d.short+" "+driverDuty(d,dr.id).sign_on+"–"+driverDuty(d,dr.id).sign_off).join(" · ")}</div></div><div class="meta">${homeTag(dr.id)}<span class="tag">${days.length} days</span><span class="tag">${dur(T(dr.hours))}</span></div></a><button onclick="copyText('${DLINK[dr.id]||""}')">Copy link</button></div>`}
 return h}
function pageDriver(did){const dr=W.drivers[did];if(!dr)return`<h1>Driver not found</h1>`;
 let h=`<div class="big"><h1>${dr.name} ${homeTag(did,true)}</h1><p class="sub">${W.week_label} · ${weekDays(did)} days · ${dur(T(dr.hours))} on duty · ${dur(weekDriving(did))} driving</p><div class="btns"><a class="btn" href="${DLINK[did]||"#"}" target="_blank" rel="noopener">Open ${dr.name}'s own page</a><button onclick="copyText('${DLINK[did]||""}')">Copy link to send to ${dr.name}</button></div><p class="sub" style="word-break:break-all;user-select:all">${DLINK[did]||""}</p>`;
 h+=`<div class="weekrota">`+W.days.map(d=>{const du=driverDuty(d,did);return du?`<div><b>${d.short}</b>${du.sign_on}–${du.sign_off}<br><span style="color:${CC[du.cor]}">${CN[du.cor]}</span></div>`:`<div class="off"><b>${d.short}</b>Day off</div>`}).join("")+`</div>`;
 for(const d of W.days){if(!driverDuty(d,did))continue;h+=`<div class="daysep">${d.label}</div>`+daySheet(d,did,{runHref:(r)=>`#/run/${d.i}/${r.id}`})}
 return h+`</div>`}
function pageVehicles(){let h=`<h1>Vehicles</h1><p class="sub">Each corridor has its own core vehicles that stay on that corridor all week and sleep with the corridor's evening driver. The yellow name is the sign in the bus window and on the student timetables. "Needs N seats" is the biggest load that vehicle carries this week: over 12 means it has to be a Rosa.</p>`;
 for(const v of Object.values(W.vehicles)){h+=`<div class="duty" style="border-left:4px solid ${v.home==="float"?"var(--line)":CC[v.home]}"><div class="head"><a href="#/vehicle/${v.id}">${plate(v.id,"big")}</a><span>${v.type} · ${v.seats} seats · ${v.home==="float"?"floating vehicle, moves to whichever corridor flexes up":"core "+CN[v.home]+" vehicle"}</span><span class="tag" style="background:${v.minseats>12?'var(--warn-bg)':'var(--ok-bg)'};color:${v.minseats>12?'var(--warn-ink)':'var(--ok-ink)'};font-weight:600">needs ${v.minseats} seats</span></div><div class="d" style="margin-top:8px;font-size:14px;color:var(--ink2)">${W.days.map(d=>{const ch=d.chains.find(c=>c.vehicle===v.id);return ch?`${d.short}: ${CN[ch.cor]}, ${ch.legs.length} runs, ${handovers(d,v.id).length} changeover${handovers(d,v.id).length===1?"":"s"}`:`${d.short}: spare`}).join(" · ")}</div></div>`}
 return h}
function pageVehicle(vid){const v=W.vehicles[vid];if(!v)return`<h1>Vehicle not found</h1>`;
 let h=`<h1>${plate(vid,"huge")}</h1><p class="sub">${v.type} · ${v.seats} seats · ${v.home==="float"?"floating vehicle":"core "+CN[v.home]+" vehicle"} · ${W.week_label}</p><div class="btns"><span class="tag" style="background:${v.minseats>12?'var(--warn-bg)':'var(--ok-bg)'};color:${v.minseats>12?'var(--warn-ink)':'var(--ok-ink)'};font-weight:600;font-size:15px">Biggest load this week: ${v.minseats}, so needs ${v.minseats>12?"a Rosa (34)":"only a Hiace (12)"}</span></div>`;
 for(const d of W.days){const rs=vehRuns(d,vid);if(!rs.length){h+=`<div class="duty"><div class="head"><b>${d.label}</b><span class="tag">spare</span></div></div>`;continue}
  const hos=handovers(d,vid);const drv=[...new Set(rs.map(r=>r.driver))];
  h+=`<div class="duty" style="border-left:4px solid ${CC[rs[0].cor]}"><div class="head"><b>${d.label} · ${CN[rs[0].cor]}</b><span>${drv.map(x=>W.drivers[x].name).join(", ")} · ${hos.length?hos.length+" changeover"+(hos.length>1?"s":""):"one driver all day"}</span></div><ul class="legs">`;
  const du0=driverDuty(d,rs[0].driver);h+=`<li class="rest"><span>${du0.sign_on}</span><span>${W.drivers[rs[0].driver].name} signs on</span></li>`;
  for(const r of rs){h+=`<li><span><b>${r.start}–${r.end}</b></span><span><a href="#/run/${d.i}/${r.id}">${r.dir==="O"?"To UoB, arrive "+r.target:"From UoB, leave "+r.target}</a> · ${r.n} pax · driver <a href="#/driver/${r.driver}">${W.drivers[r.driver].name}</a></span></li>`;const ho=hos.find(x=>x.after===r.id);if(ho)h+=`<li class="changeover"><span>${ho.when}–${ho.next}</span><span><b>Driver changeover at ${esc(ho.place)}</b>: ${W.drivers[ho.from].name} hands ${v.name} to ${W.drivers[ho.to].name}${ho.empty?", who runs empty to "+esc(ho.empty):""} · ${dur(ho.gap)} between runs</span></li>`}
  const last=rs[rs.length-1];h+=`<li class="rest"><span>${driverDuty(d,last.driver).sign_off}</span><span>${W.drivers[last.driver].name} signs off</span></li></ul></div>`}
 return h}
function riderRuns(d,email){return d.runs.filter(r=>r.stops.some(s=>s.riders.includes(email))).sort((a,b)=>a.start.localeCompare(b.start))}
function pagePooling(i){const d=W.days[i];if(!d)return`<h1>Day not found</h1>`;
 let h=`<h1>Pooling · ${d.label}</h1><p class="sub">Riders travelling that day, their pool point and which runs they are on. Lift = more than about 1.3 km from the pool point. "Renewal not confirmed" = the export assumed this rider renews weekly; check before Friday.</p><div class="btns">${W.days.map(x=>`<a class="btn" href="#/pooling/${x.i}" ${x.i===i?'style="background:var(--bg2);font-weight:600"':""}>${x.short}</a>`).join("")}</div>`;
 const emails=new Set(d.runs.flatMap(r=>r.stops.flatMap(s=>s.riders)));
 for(const c of ["S1","N1","M2","J3","A1","F4","D5"]){const rs=[...emails].map(e=>[e,W.riders[e]]).filter(([e,p])=>p.cor===c).sort((a,b)=>(b[1].lift-a[1].lift)||b[1].walk-a[1].walk);if(!rs.length)continue;
  h+=`<section class="cor" style="--c:${CC[c]}"><h2>${CN[c]}</h2><div class="tw"><table><tr><th>Rider</th><th>Pool point</th><th>From home</th><th>Runs that day</th><th>Booking note</th></tr>`;
  for(const [e,p] of rs){const pool=W.pools[c].find(q=>q.id===p.pool);const rr=riderRuns(d,e);
   h+=`<tr><td><b>${esc(p.name)}</b>${p.assumed?' <span class="tag" style="border:1px dashed var(--border);background:transparent;color:var(--ink2)">renewal not confirmed</span>':''}<br><span style="color:var(--ink2);font-size:13px">${esc(p.addr.split(",").slice(0,2).join(","))}</span></td><td><a href="${gmap(pool)}" target="_blank" rel="noopener">${esc(pool.name)}</a></td><td>${p.lift?'<span class="tag lift">lift · '+km(p.walk)+'</span>':'<span class="tag walk">walk '+km(p.walk)+'</span>'}</td><td><div style="display:flex;flex-direction:column;gap:4px;align-items:flex-start">${rr.map(r=>{const st=r.stops.find(s=>s.riders.includes(e));return `<a class="tag" href="#/run/${i}/${r.id}" style="background:${CC[r.cor]}22;color:var(--ink)">${r.dir==="O"?"in · "+st.time+" pickup, arrive "+r.target:"out · leave "+r.target+", "+st.time+" drop"} · ${W.vehicles[r.vehicle].name}</a>`}).join("")}</div></td><td style="color:var(--ink2);font-size:13.5px">${esc(p.note||"")}</td></tr>`}
  h+=`</table></div></section>`}
 return h}
function route(){const p=(location.hash||"#/").slice(1).split("/").filter(Boolean);let h="";
 if(!p.length)h=pageWeek();else if(p[0]==="day")h=pageDay(+p[1]);else if(p[0]==="run")h=pageRun(+p[1],p[2]);else if(p[0]==="network")h=pageNetwork();else if(p[0]==="corridors")h=pageCorridors();else if(p[0]==="drivers")h=pageDrivers();else if(p[0]==="driver")h=pageDriver(p[1]);else if(p[0]==="vehicles")h=pageVehicles();else if(p[0]==="vehicle")h=pageVehicle(p[1]);else if(p[0]==="pooling")h=pagePooling(+(p[1]||0));else h=pageWeek();
 $("#app").innerHTML=h;const top=p[0]||"";document.querySelectorAll("#nav a").forEach(a=>{const t=a.getAttribute("href").slice(2).split("/")[0];a.classList.toggle("on",(t===""&&(top===""||top==="day"||top==="run"))||(t==="network"&&top==="network")||(t==="corridors"&&top==="corridors")||(t==="drivers"&&(top==="drivers"||top==="driver"))||(t==="vehicles"&&(top==="vehicles"||top==="vehicle"))||(t==="pooling"&&top==="pooling"))});window.scrollTo(0,0)}
window.onUnlock=function(pt){const D=JSON.parse(pt);W=D.W;COAST=D.COAST;DLINK=D.DLINK;buildOffer();$("#hdr").textContent=W.week_label;window.addEventListener("hashchange",route);route();};
</script></body></html>
